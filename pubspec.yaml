name: jupdater
description: >-
  Update checker for Flutter apps (Android, iOS, macOS, Windows, Linux) with a
  built-in responsive force-update overlay and update bottom sheet. Zero
  third-party dependencies.
version: 1.0.0
homepage: https://github.com/qtlws/jupdater-flutter-sdk
repository: https://github.com/qtlws/jupdater-flutter-sdk
issue_tracker: https://github.com/qtlws/jupdater-flutter-sdk/issues
topics:
  - updater
  - force-update
  - in-app-update
  - version-checkF

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

# Intentionally no third-party dependencies (Flutter SDK only) so that
# JUpdater can never cause a dependency-version conflict in a host app.
dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.qtlws.jupdater
        pluginClass: JUpdaterPlugin
      ios:
        pluginClass: JUpdaterPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: JUpdaterPlugin
        sharedDarwinSource: true
      windows:
        dartPluginClass: JUpdaterDesktop
      linux:
        dartPluginClass: JUpdaterDesktop
